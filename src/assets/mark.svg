<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    The Deskstart mark — "Comet" (1.2, ADR-033).

    Six points, each a step of a profile, set out as a play triangle: three in
    a column, two, then one. They grow and brighten towards the last, so the
    mark is already moving towards Run while it stands still — the steps
    gathering speed into the button. The last point is amber, the one warm
    colour in the mark: the moment you press Run, and the colour of a morning.

    The ground is a superellipse, the Windows 11 icon shape, in a blue-black
    deep enough that the cyan and the amber read on a light taskbar and a dark
    one alike. Blue against amber is the colour pair the commonest colour-vision
    differences keep apart. Drawn to survive sixteen pixels: the smallest
    point is never thinner than the gap between points.
  -->
  <path d="M0 128C0 22.6 22.6 0 128 0S256 22.6 256 128 233.4 256 128 256 0 233.4 0 128Z" fill="#0B1220"/>
  <circle cx="76" cy="72" r="13" fill="#22D3EE" fill-opacity="0.5"/>
  <circle cx="76" cy="128" r="15" fill="#22D3EE" fill-opacity="0.62"/>
  <circle cx="76" cy="184" r="17" fill="#22D3EE" fill-opacity="0.74"/>
  <circle cx="130" cy="100" r="19" fill="#60A5FA" fill-opacity="0.86"/>
  <circle cx="130" cy="156" r="21" fill="#60A5FA" fill-opacity="0.94"/>
  <circle cx="184" cy="128" r="26" fill="#FBBF24"/>
</svg>
